name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (for example v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The conformance vectors must be current
        run: python3 tools/reference/generate_vectors.py --check

  build-macos:
    name: Build the macOS installers
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Build the Intel installer
        run: python3 scripts/build_macos.py --arch x86_64 --dmg

      - name: Build the Apple Silicon installer
        run: python3 scripts/build_macos.py --arch arm64 --dmg

      - name: Build the universal installer
        run: python3 scripts/build_macos.py --arch both --dmg

      - name: Run the macOS test suite
        run: python3 scripts/run_tests_macos.py

      - name: Collect the installers
        run: |
          mkdir -p artifacts
          cp dist/*.dmg artifacts/ || true
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: artifacts/

  build-android:
    name: Build the Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        run: |
          # The GitHub runners ship the Android SDK; the third-party
          # setup-android action is not used because it fails intermittently.
          SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Test and build
        working-directory: android
        env:
          ANDROCALL_REPO_ROOT: ${{ github.workspace }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest
          ./gradlew --no-daemon assembleRelease

      - name: Collect the APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/androcall-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/

  publish:
    name: Publish the release
    needs: [verify, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Name the assets
        run: |
          cd artifacts
          [ -d macos-installers ] && cd macos-installers || true
          cd ..
          find artifacts -name '*.dmg' -print
          # The DMGs are already named androcall-macOS-<arch>.dmg by the build.
          if [ -d android-apk ]; then
            cp android-apk/androcall-Android.apk artifacts/androcall-Android.apk 2>/dev/null || true
          fi
          ls -la artifacts/

      - name: Checksums
        run: |
          cd artifacts
          find . -name '*.dmg' -o -name '*.apk' | sort | while read -r file; do
            shasum -a 256 "$file" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: true
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*.dmg
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
