name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol:
    name: Protocol reference and conformance vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the reference implementation's known answers
        run: python3 tools/reference/androcall_ref.py

      - name: Verify the conformance vectors are up to date
        run: python3 tools/reference/generate_vectors.py --check

  macos:
    name: macOS (Intel and Apple Silicon)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          swift --version
          xcrun --show-sdk-path

      - name: Build for Intel
        run: python3 scripts/build_macos.py --arch x86_64

      - name: Build for Apple Silicon
        run: python3 scripts/build_macos.py --arch arm64

      - name: Run the macOS test suite
        run: python3 scripts/run_tests_macos.py

      - name: Check the bundles
        run: |
          for app in build/macos/androcall-*.app; do
            echo "== $app"
            plutil -lint "$app/Contents/Info.plist"
            codesign --verify --strict "$app"
            file "$app/Contents/MacOS/androcall"
          done

  android:
    name: Android companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install the Android SDK packages the build needs
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1" "platform-tools"

      - name: Unit tests and protocol conformance
        working-directory: android
        env:
          ANDROCALL_REPO_ROOT: ${{ github.workspace }}
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build the release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: androcall-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  security:
    name: Security and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on committed secrets
        run: |
          if git ls-files | grep -E '\.(pem|p12|keystore|jks)$|^\.env'; then
            echo "A credential-looking file is committed. Remove it." >&2
            exit 1
          fi
          echo "No credential files are committed."

      - name: Fail on large files
        run: |
          size=$(git ls-files -z | xargs -0 du -k 2>/dev/null | sort -rn | head -1 | cut -f1)
          echo "Largest tracked file: ${size} kB"
          if [ "${size}" -gt 5120 ]; then
            echo "A tracked file is larger than 5 MB." >&2
            exit 1
          fi

      - name: Dependency audit (Android)
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > dependency-tree.txt
          cat dependency-tree.txt
          echo "--- resolved direct dependencies ---"
          grep -E "^[\\+ \\\\---] " dependency-tree.txt | sort -u
